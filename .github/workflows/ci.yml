name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify generated registries
        run: python src/scripts/build_registry.py --check

      - name: Verify llms-full.txt is up-to-date
        run: |
          python src/scripts/generate_llms_txt.py
          git diff --exit-code llms-full.txt

      - name: Run Ruff
        run: python -m ruff check . --exclude venv,tmp_pytest,outputs,chroma_db,_docx_extract_tmp

      - name: Run scoped pre-Cello type gate
        run: |
          python -m mypy \
            src/mcp_server/and2_pilot_preflight.py \
            src/schemas/and2_pilot.py \
            application/offline_contract_validation.py \
            src/catalog/agent_catalog.py

      - name: Run tests with branch coverage
        run: |
          mkdir -p outputs/pre_release
          python -m pytest \
            --cov=application \
            --cov=benchmark_suite \
            --cov=src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:outputs/pre_release/coverage.json

      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: outputs/pre_release/coverage.json
          if-no-files-found: warn
