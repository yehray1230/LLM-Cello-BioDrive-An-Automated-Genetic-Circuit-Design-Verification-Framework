[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genetic_circuit_design_workflow"
version = "2.0.0"
description = "An LLM-orchestrated genetic-circuit design workflow built around Cello"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
primer-design = ["primer3-py>=2.3"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.ruff]
exclude = ["pytest_temp*", ".pytest_cache", ".ruff_cache", "venv", ".venv"]

[tool.coverage.run]
branch = true
source = ["application", "benchmark_suite", "src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/mutants/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.json]
output = "outputs/pre_release/coverage.json"
pretty_print = true

[tool.mutmut]
source_paths = ["src/utils/safety_checker.py"]
pytest_add_cli_args_test_selection = ["tests/test_safety_boundary.py"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]
max_stack_depth = 8
